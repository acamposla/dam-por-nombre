[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dam-por-nombre"
version = "1.0.0"
description = "Un DAM sobre el PIM sin licencias: el nombre del archivo dice a qué ficha y a qué campo va"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["dam"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["dam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
